<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شطرنج أندلس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, exact arbiter's desk; three faces of one tournament (public, staff, hall screens).
   IDEA: Alandalus Private Schools' own scoreboard; the eight-petal emblem frames the pairing sheet.
   PICTURE: the school's photo of two students at a chess table as a faded backdrop, emblem ring turning.
   COLOUR and TYPE: school navy, white sheet, emblem cyan/purple/coral stripe; Reem Kufi titles, Plex Arabic body.
   LAYOUT: public = band + tabs; staff = side menu + working column; screens = full-bleed navy board. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1716);--ink:light-dark(#14201f,#e9efee);--mut:light-dark(#55625f,#9fb0ad);--line:light-dark(#dfe6e4,#26332f);--soft:light-dark(#f1f6f5,#16211f);--tile:#123885;--tile2:#0e2c6b;--tl:light-dark(#123885,#9cc3ff);--acc:light-dark(#b8364a,#f08a96);--cy:#07a7d0;--pu:#a24c92;--co:#e16363;--ok:light-dark(#1e6b3a,#7fd19b);--warn:light-dark(#8a5a00,#f3c56b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--bs,16px)/1.6 var(--bf,'IBM Plex Sans Arabic'),system-ui,sans-serif;overflow-x:clip}
.band{--hb:light-dark(#e8f3fb,#121d33);background:linear-gradient(180deg,var(--hb),var(--bg));position:relative;overflow:hidden;padding:20px max(5vw,16px) 0}
.band::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(var(--tile) 0 25%,transparent 0 50%) 0 0/72px 72px;opacity:.05;pointer-events:none}
.photo{position:absolute;inset:0;background:url(players.jpg) 50% 72%/cover no-repeat;opacity:.42;pointer-events:none}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,transparent 28%)}
.emb{position:absolute;top:50%;left:0;width:190px;height:190px;transform:translateY(-50%);opacity:.92;pointer-events:none;z-index:2;filter:drop-shadow(0 6px 14px #12388530)}.emb img{position:absolute;inset:0;width:100%;height:100%}
.ring{animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.emb{width:110px;height:110px;top:64px}}@media(max-width:600px){.emb{width:72px;height:72px;top:40px}}
.hd{position:relative;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 18px}
.ht{position:relative;z-index:1;width:min(820px,100%);display:flex;flex-direction:column;align-items:center;padding:22px 40px 26px;background:radial-gradient(ellipse 50% 50% at 50% 50%,color-mix(in srgb,var(--bg) 78%,transparent) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 55%,transparent 100%)}
.logo img{height:52px;width:auto;display:block;margin-bottom:8px}
.stripe{height:6px;background:linear-gradient(90deg,var(--cy) 0 25%,#0f69b2 25% 50%,var(--pu) 50% 75%,var(--co) 75%)}
h1{font-family:var(--hf,'Reem Kufi'),serif;font-size:clamp(30px,5.5vw,46px);line-height:1.45;margin:4px 0;color:var(--tl)}
h2{font-family:var(--hf,'Reem Kufi');font-size:26px;line-height:1.5;margin:0 0 14px;color:var(--tl)}
h3{font-size:18px;margin:0 0 10px}
.sub{color:var(--mut);font-size:16px;line-height:1.7}
.stat{display:flex;gap:6px 0;flex-wrap:wrap;justify-content:center;font-size:14px;margin-top:14px;color:var(--mut)}.stat>div{min-width:96px;padding:2px 18px}.stat>div+div{border-inline-start:1px solid color-mix(in srgb,var(--tile) 25%,transparent)}.stat b{font-size:22px;line-height:1.5;display:block;font-family:var(--hf,'Reem Kufi');color:var(--tl)}
nav.tabs{position:relative;max-width:1100px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;justify-content:safe center}
nav.tabs a{flex:none;color:var(--tl);text-decoration:none;padding:12px 16px;border-radius:12px 12px 0 0;font-weight:500;min-height:44px}
nav.tabs a.on{background:var(--tile);color:#fff}
main{max-width:1100px;margin:0 auto;padding:24px max(5vw,16px) 60px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sp{justify-content:space-between}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.cats button{border-radius:999px}
button,select,input,textarea{font:inherit;font-size:max(16px,1em);color:var(--ink)}
button,.btn{min-height:44px;padding:8px 16px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
button:hover,.btn:hover{background:var(--soft)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri,.btn.pri{background:var(--tile);border-color:var(--tile);color:#fff}button.pri:hover{background:var(--tile2)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.dan{color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.sm{min-height:36px;padding:4px 10px;font-size:14px}
input,select,textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=checkbox]{min-height:0;width:20px;height:20px}
textarea{width:100%;min-height:90px}
label{font-size:14px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;background:var(--bg)}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--soft)}.kpi span{font-size:13px;color:var(--mut)}.kpi b{display:block;font-size:24px;font-family:var(--hf,'Reem Kufi');color:var(--tl);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--mut);font-weight:500;text-align:start;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.games{display:flex;flex-direction:column;gap:10px}
.g{display:grid;grid-template-columns:48px minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.g .bd{font-family:var(--hf,'Reem Kufi');font-size:22px;color:var(--tl);text-align:center}
.pl{display:flex;flex-direction:column}.pl small{color:var(--mut);font-size:13px}.pl.b{text-align:left}
.res{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.res button{border:0;border-radius:0;min-width:46px;padding:6px 8px;min-height:40px}
.res button+button{border-inline-start:1px solid var(--line)}
.rv{font-weight:700;font-size:18px;text-align:center;min-width:64px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--mut);vertical-align:-1px;margin-inline-end:6px}.dot.w{background:#fff}.dot.k{background:#111}
.medal{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#14201f}
.m1{background:#e4c25b}.m2{background:#cfd5d8}.m3{background:#d9a27a}
.pill{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--acc)}.pill.live{color:#fff;background:var(--co);border-color:var(--co)}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:16px}
.note{font-size:14px;color:var(--mut)}
.warnbox{border:1px solid var(--warn);border-radius:12px;padding:10px 14px;color:var(--warn);margin-bottom:14px;font-size:15px}
.ann{border-inline-start:4px solid var(--cy);background:var(--soft);padding:10px 14px;border-radius:10px;margin-bottom:10px}.ann.alert{border-color:var(--co)}
.sched{display:grid;gap:8px}.sched div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}.sched b{font-family:var(--hf,'Reem Kufi');color:var(--tl);font-size:18px}
.ft{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px;margin-top:28px;font-size:14px;color:var(--mut)}.ft img{height:40px}.ft a{color:var(--tl);font-weight:500}
.pzg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));margin-top:14px}
.pz{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg)}
.pzh{display:flex;gap:12px;align-items:center;padding:14px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--tile) 12%,var(--bg)),var(--bg))}
.pzn{width:40px;height:40px;flex:none;border-radius:50%;background:var(--tile);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--hf,'Reem Kufi');font-size:20px}
.pzt td,.pzt th{padding:10px 16px}.pzt tr.gold td{background:color-mix(in srgb,#e2a91e 14%,var(--bg))}.pzt tr.silver td{background:color-mix(in srgb,#aeb8c6 18%,var(--bg))}.pzt tr.bronze td{background:color-mix(in srgb,#c98a5e 16%,var(--bg))}
.pzt tr td:first-child{border-inline-start:5px solid transparent}.pzt tr.gold td:first-child{border-inline-start-color:#e2a91e}.pzt tr.silver td:first-child{border-inline-start-color:#aeb8c6}.pzt tr.bronze td:first-child{border-inline-start-color:#c98a5e}
.pzt b{font-family:var(--hf,'Reem Kufi');font-size:22px;color:var(--tl)}.pzt tr.gold b{color:light-dark(#8a6200,#f0c64b)}
.pzf{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}.pzf b{color:var(--tl)}
.enc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}.enc div{border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-top:4px solid var(--cy)}.enc div:nth-child(2){border-top-color:var(--pu)}.enc div:nth-child(3){border-top-color:#0f69b2}.enc div:nth-child(4){border-top-color:var(--co)}.enc div:nth-child(5){border-top-color:#e2a91e}.enc b{display:block}.enc span{font-size:14px;color:var(--mut)}
.kpis.fin .kpi{background:var(--bg);border-top:4px solid var(--tile)}.kpis.fin .kpi:nth-child(2){border-top-color:var(--ok)}.kpis.fin .kpi:nth-child(3){border-top-color:var(--co)}.kpis.fin .kpi:nth-child(4){border-top-color:#e2a91e}.kpi span+b+span{display:block;font-size:12px}
/* staff */
.adm{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 230px;max-width:100%;background:var(--tile);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.side img{height:40px;align-self:flex-start;background:#fff;border-radius:10px;padding:4px 8px;margin-bottom:8px}
.side a{color:#fff;text-decoration:none;padding:10px 12px;border-radius:10px;min-height:44px;display:flex;align-items:center;justify-content:space-between}
.side a.on,.side a:hover{background:#ffffff22}.side .who{font-size:13px;opacity:.85;margin:6px 4px 10px}
.side .bdg{background:var(--co);border-radius:999px;font-size:12px;padding:0 8px}
.work{flex:999 1 560px;min-width:0;padding:22px max(3vw,14px) 60px}
@media(max-width:820px){.side{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px;align-items:center}.side a{flex:none}.side .who,.side .sep{display:none}.side img{margin:0}}
/* screens */
.tv{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1d4aa8 0%,#0b1f4d 60%,#081638 100%);color:#fff;display:flex;flex-direction:column;font-size:clamp(16px,1.6vw,30px)}
.tvh{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:1.2vw 2.4vw;border-bottom:1px solid #ffffff22}
.tvh img{height:clamp(40px,4.5vw,84px);background:#fff;border-radius:12px;padding:6px 10px}
.tvh h1{color:#fff;font-size:clamp(26px,3vw,56px);margin:0;line-height:1.3}
.tvclock{font-family:'Reem Kufi';font-size:clamp(24px,2.6vw,48px);font-variant-numeric:tabular-nums}
.tvb{flex:1;padding:1.4vw 2.4vw;display:flex;flex-direction:column;gap:1vw}
.tvt{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}.tvt b{font-family:'Reem Kufi';font-size:clamp(24px,2.4vw,46px)}.tvt span{opacity:.8}
.tvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(560px,100%),1fr));gap:.8vw}
.tvr{display:grid;grid-template-columns:3em minmax(0,1fr) 4.2em minmax(0,1fr);align-items:center;gap:.8em;background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;padding:.5em .9em}
.tvr .n{font-family:'Reem Kufi';color:#7fd6ec;font-size:1.3em;text-align:center}.tvr .r{text-align:center;font-weight:700;background:#ffffff1f;border-radius:10px;padding:.15em 0}.tvr .bl{text-align:left}
.tvs{width:100%;border-collapse:collapse;font-size:1.05em}.tvs td,.tvs th{border-bottom:1px solid #ffffff22;padding:.45em .6em;color:#fff}.tvs th{opacity:.75;font-weight:500}
.tvann{font-size:1.6em;line-height:1.6;background:#ffffff14;border-radius:18px;padding:1em 1.4em;border-inline-start:8px solid #7fd6ec}
.tvf{display:flex;justify-content:space-between;align-items:center;padding:.8vw 2.4vw;background:#00000033;font-size:.85em}
.tvdots{display:flex;gap:8px}.tvdots i{width:12px;height:12px;border-radius:50%;background:#ffffff44}.tvdots i.on{background:#7fd6ec}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.on{display:flex}#modal>.card{max-width:640px;width:100%;max-height:90vh;overflow:auto;margin:0}
@media(prefers-reduced-motion:reduce){#toast{transition:none}.ring{animation:none}}
@media(max-width:600px){.g{grid-template-columns:36px minmax(0,1fr) minmax(0,1fr)}.g .res,.g .rv{grid-column:1/-1;justify-self:stretch}.res button{flex:1}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mut)}.stack td:empty{display:none}
 .tvr{grid-template-columns:2em minmax(0,1fr) 3.4em minmax(0,1fr)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div id="root"><div class="empty" style="margin:40px">جارٍ التحميل…</div></div>
<div id="modal" role="dialog" aria-modal="true"><div class="card" id="mBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" hidden accept=".csv,.xlsx,.xls">
<input type="file" id="rcptIn" hidden accept="image/*,application/pdf">
<script src="platform.js"></script>
<script src="swiss.js"></script>
<script src="core.js"></script>
<script src="pub.js"></script>
<script src="tv.js"></script>
<script src="adm.js"></script>
<script src="out.js"></script>
<script src="boot.js"></script>

</body>
</html>
